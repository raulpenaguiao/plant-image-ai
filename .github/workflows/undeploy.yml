name: Undeploy

# Retire the site: push a tag named `undeploy` (or `undeploy/<anything>`, e.g. `undeploy/2026-11-17`).
#   git tag undeploy && git push origin undeploy
# To run it again with the same tag name, delete the tag first (git push origin :refs/tags/undeploy).
on:
  push:
    tags:
      - undeploy
      - 'undeploy/**'

concurrency:
  group: vps-deploy          # never run alongside another deploy/undeploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  undeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS not set; trusting the host key on first contact"
            ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" > ~/.ssh/known_hosts
          fi

      - name: Upload maintenance page and run undeploy on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          APP_USER: ${{ secrets.VPS_APP_USER }}
          SERVICE: ${{ vars.VPS_SERVICE || 'plant-classifier' }}
          PORT: ${{ vars.VPS_APP_PORT || '8000' }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" -o BatchMode=yes)
          REMOTE="$VPS_USER@$VPS_HOST"
          STAGE="/tmp/undeploy-${GITHUB_RUN_ID}"

          ssh "${SSH_OPTS[@]}" "$REMOTE" "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          scp -P "${VPS_PORT:-22}" -i ~/.ssh/id_deploy -o BatchMode=yes \
            plant-classifier-app/deploy/undeploy/{undeploy.sh,server.py,index.html} "$REMOTE:$STAGE/"

          SUDO=""; [ "$VPS_USER" = "root" ] || SUDO="sudo -n"
          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "$SUDO env SERVICE='$SERVICE' PORT='$PORT' APP_DIR='${APP_DIR}' APP_USER='${APP_USER}' bash '$STAGE/undeploy.sh'; rc=\$?; rm -rf '$STAGE'; exit \$rc"

      - name: Check the public endpoint
        env:
          PUBLIC_URL: ${{ vars.VPS_PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "VPS_PUBLIC_URL not set; skipping"; exit 0; fi
          for i in 1 2 3 4 5; do
            out="$(curl -sS -m 10 -w '\n%{http_code}' "$PUBLIC_URL" || true)"
            if [ "${out##*$'\n'}" = "410" ] && grep -q "not maintained anymore" <<<"$out"; then
              echo "Public page is serving the maintenance notice"; exit 0
            fi
            sleep 3
          done
          echo "::error::Public URL is not serving the maintenance page"; exit 1
